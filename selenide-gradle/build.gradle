plugins {
    id 'java'
}

repositories {
    mavenCentral()
    maven { url = 'https://jitpack.io' }
}

tasks.withType(JavaCompile).configureEach {
    options.release = 25
}

dependencies {
    testImplementation 'com.github.Visual-Regression-Tracker:sdk-java:5.5.0'
    testImplementation 'com.codeborne:selenide:7.19.1'
    testImplementation 'org.testng:testng:7.12.0'
    // Selenide 7.19.1 brings opentelemetry 1.66.0 (CVE-2026-118259)
    testImplementation platform('io.opentelemetry:opentelemetry-bom:1.68.0')
}

test {
    useTestNG()
}
