name: CI

on:
  push:
    branches: [master]
  pull_request:

permissions:
  contents: read

concurrency:
  group: ${{ github.workflow }}-${{ github.ref }}
  cancel-in-progress: true

jobs:
  maven:
    name: ${{ matrix.example }}
    runs-on: ubuntu-latest
    strategy:
      fail-fast: false
      matrix:
        example: [playwright, selenium-maven]
    defaults:
      run:
        working-directory: ${{ matrix.example }}
    env:
      VRT_APIURL: http://localhost:4200
      VRT_APIKEY: DEFAULTUSERAPIKEYTOBECHANGED
      VRT_PROJECT: Default project
      VRT_BRANCHNAME: master
      VRT_ENABLESOFTASSERT: "true"
    steps:
      - uses: actions/checkout@v7
      - name: Start Visual Regression Tracker
        working-directory: .github/vrt
        run: docker compose up -d --quiet-pull
      - uses: actions/setup-java@v6
        with:
          distribution: temurin
          java-version: 17
          cache: maven
          cache-dependency-path: ${{ matrix.example }}/pom.xml
      - run: mvn -B test-compile
      - name: Wait for Visual Regression Tracker
        run: timeout 180 bash -c 'until curl -s -o /dev/null http://localhost:4200; do sleep 2; done'
      - run: mvn -B test

  gradle:
    name: ${{ matrix.example }}
    runs-on: ubuntu-latest
    strategy:
      fail-fast: false
      matrix:
        example: [selenide-gradle]
    defaults:
      run:
        working-directory: ${{ matrix.example }}
    env:
      VRT_APIURL: http://localhost:4200
      VRT_APIKEY: DEFAULTUSERAPIKEYTOBECHANGED
      VRT_PROJECT: Default project
      VRT_BRANCHNAME: master
      VRT_ENABLESOFTASSERT: "true"
    steps:
      - uses: actions/checkout@v7
      - name: Start Visual Regression Tracker
        working-directory: .github/vrt
        run: docker compose up -d --quiet-pull
      - uses: actions/setup-java@v6
        with:
          distribution: temurin
          java-version: 17
      - uses: gradle/actions/setup-gradle@v6
      - run: ./gradlew testClasses
      - name: Wait for Visual Regression Tracker
        run: timeout 180 bash -c 'until curl -s -o /dev/null http://localhost:4200; do sleep 2; done'
      - run: ./gradlew test

  # Appium needs an iOS simulator and the standalone client a folder of images, so CI only compiles them.
  compile:
    name: ${{ matrix.example }}
    runs-on: ubuntu-latest
    strategy:
      fail-fast: false
      matrix:
        example: [appium-maven, standalone-from-folder-maven]
    defaults:
      run:
        working-directory: ${{ matrix.example }}
    steps:
      - uses: actions/checkout@v7
      - uses: actions/setup-java@v6
        with:
          distribution: temurin
          java-version: 17
          cache: maven
          cache-dependency-path: ${{ matrix.example }}/pom.xml
      - run: mvn -B test-compile
